name: Build and validate calendar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate authoritative baselines
        run: python -m unittest discover -s tests -v
      - name: Build ICS
        run: python src/build.py
      - name: Commit generated calendar when changed
        run: |
          if git diff --quiet -- dist/china-calendar.ics; then
            echo "No generated change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/china-calendar.ics
          git commit -m "chore: refresh generated calendar"
          git push
      - name: Remind when next-year statutory data is missing
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(date -u +%m)
          YEAR=$(date -u +%Y)
          NEXT=$((YEAR + 1))
          if [ "$MONTH" -lt 11 ] || [ -f "data/statutory/${NEXT}.json" ]; then
            exit 0
          fi
          TITLE="待核验并录入 ${NEXT} 年国务院节假日通知"
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            exit 0
          fi
          gh issue create --title "$TITLE" --body "准确性优先：仅在国务院办公厅正式发布 ${NEXT} 年部分节假日安排后录入；不要根据民间日历或往年惯例预测。"
